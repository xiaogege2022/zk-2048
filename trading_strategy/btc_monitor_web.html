<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BTC实时信号监控器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #00d4ff; }
        .status-bar { background: #0f3460; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-green { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .dot-red { background: #ff4757; }
        .dot-yellow { background: #ffa502; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .price-display { font-size: 28px; font-weight: bold; color: #00d4ff; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-start { background: #00ff88; color: #000; }
        .btn-start:hover { background: #00cc6a; }
        .btn-stop { background: #ff4757; color: #fff; }
        .btn-stop:hover { background: #cc3a47; }
        .btn-test { background: #ffa502; color: #000; }
        .log-container { background: #0a0a1a; border-radius: 10px; padding: 15px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .log-entry { padding: 5px 0; border-bottom: 1px solid #1a1a3a; }
        .log-time { color: #888; }
        .log-info { color: #00d4ff; }
        .log-signal { color: #00ff88; font-weight: bold; }
        .log-error { color: #ff4757; }
        .log-warning { color: #ffa502; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #0f3460; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #00d4ff; }
        .stat-label { color: #888; font-size: 12px; margin-top: 5px; }
        .config-section { background: #0f3460; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .config-title { margin-bottom: 10px; color: #00d4ff; }
        .config-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .config-row input { flex: 1; min-width: 200px; padding: 8px; border-radius: 5px; border: 1px solid #333; background: #1a1a3a; color: #fff; }
        .signal-list { margin-top: 20px; }
        .signal-card { background: linear-gradient(135deg, #0f3460 0%, #1a1a3a 100%); border-left: 4px solid #00ff88; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .signal-card.short { border-left-color: #ff4757; }
        .signal-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .signal-type { font-weight: bold; font-size: 18px; }
        .signal-type.long { color: #00ff88; }
        .signal-type.short { color: #ff4757; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 BTC/USDT 实时信号监控器</h1>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未启动</span>
            </div>
            <div class="price-display">BTC: $<span id="currentPrice">--</span></div>
            <div class="status-item">
                <span>恐惧贪婪: <span id="fearGreed">--</span></span>
            </div>
            <div class="status-item">
                <span>检查次数: <span id="checkCount">0</span></span>
            </div>
        </div>

        <div class="config-section">
            <div class="config-title">📡 推送配置</div>
            <div class="config-row">
                <input type="text" id="tgToken" placeholder="Telegram Bot Token" value="8402682954:AAH4FnWpdZ4t1tQAFKcg2GXjMtzdfSd7P8A">
                <input type="text" id="tgChatId" placeholder="Telegram Chat ID" value="6935870343">
            </div>
            <div class="config-row">
                <input type="text" id="discordWebhook" placeholder="Discord Webhook URL" value="https://discord.com/api/webhooks/1444323268600266773/i5WXa-v66RrHnl6SP6IVXw4vtABzavxxeOZo6OJAk_gRMV-Khx88wWRSE_aNQ4kSqtEm">
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" id="btnStart" onclick="startMonitor()">▶️ 启动监控</button>
            <button class="btn-stop" id="btnStop" onclick="stopMonitor()" disabled>⏹️ 停止监控</button>
            <button class="btn-test" onclick="sendTestSignal()">🧪 发送测试信号</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="signalCount">0</div>
                <div class="stat-label">发现信号数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lastCheck">--</div>
                <div class="stat-label">上次检查</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rsiValue">--</div>
                <div class="stat-label">RSI (14)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="emaStatus">--</div>
                <div class="stat-label">EMA趋势</div>
            </div>
        </div>

        <div class="log-container" id="logContainer"></div>
    </div>

    <script>
        // 配置
        let isRunning = false;
        let intervalId = null;
        let checkCount = 0;
        let signalCount = 0;
        let lastSignals = {};
        const SIGNAL_COOLDOWN = 3600000; // 1小时冷却

        // 策略配置 - 胜率 > 50%
        const STRATEGIES = {
            "EMA_7_25_Golden": {win_rate: 80.0, tp: 15.0, sl: 7.0, leverage: 25, type: "LONG", desc: "EMA7上穿EMA25金叉信号"},
            "EMA_7_25_Death": {win_rate: 65.0, tp: 10.0, sl: 5.0, leverage: 20, type: "SHORT", desc: "EMA7下穿EMA25死叉信号"},
            "EMA_50_200_Golden": {win_rate: 71.4, tp: 25.0, sl: 10.0, leverage: 35, type: "LONG", desc: "EMA50上穿EMA200黄金交叉"},
            "EMA_50_200_Death": {win_rate: 68.0, tp: 15.0, sl: 7.0, leverage: 20, type: "SHORT", desc: "EMA50下穿EMA200死亡交叉"},
            "RSI_Oversold": {win_rate: 78.0, tp: 15.0, sl: 7.0, leverage: 20, type: "LONG", desc: "RSI极度超卖(<20)反弹"},
            "RSI_Overbought": {win_rate: 72.0, tp: 10.0, sl: 5.0, leverage: 15, type: "SHORT", desc: "RSI极度超买(>80)回调"},
            "MACD_Golden": {win_rate: 65.0, tp: 12.0, sl: 6.0, leverage: 20, type: "LONG", desc: "MACD金叉信号"},
            "MACD_Death": {win_rate: 62.0, tp: 10.0, sl: 5.0, leverage: 15, type: "SHORT", desc: "MACD死叉信号"},
            "Fear_Extreme": {win_rate: 78.0, tp: 20.0, sl: 10.0, leverage: 25, type: "LONG", desc: "恐惧贪婪指数<10极度恐惧"},
            "Greed_Extreme": {win_rate: 65.0, tp: 15.0, sl: 7.0, leverage: 15, type: "SHORT", desc: "恐惧贪婪指数>90极度贪婪"},
            "Flash_Crash": {win_rate: 66.7, tp: 20.0, sl: 10.0, leverage: 20, type: "LONG", desc: "7日暴跌超15%抄底"},
            "Bullish_Pin_Bar": {win_rate: 71.4, tp: 15.0, sl: 8.0, leverage: 25, type: "LONG", desc: "看涨Pin Bar形态"},
            "Bearish_Pin_Bar": {win_rate: 65.0, tp: 12.0, sl: 6.0, leverage: 20, type: "SHORT", desc: "看跌Pin Bar形态"},
        };

        // 工具函数
        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            container.insertBefore(entry, container.firstChild);
            if (container.children.length > 100) container.removeChild(container.lastChild);
        }

        function updateStatus(running) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            document.getElementById('btnStart').disabled = running;
            document.getElementById('btnStop').disabled = !running;
            if (running) {
                dot.className = 'status-dot dot-green';
                text.textContent = '监控中...';
            } else {
                dot.className = 'status-dot dot-red';
                text.textContent = '已停止';
            }
        }

        // 技术指标计算
        function calculateEMA(prices, period) {
            if (prices.length < period) return [];
            const multiplier = 2 / (period + 1);
            let ema = [prices.slice(0, period).reduce((a, b) => a + b, 0) / period];
            for (let i = period; i < prices.length; i++) {
                ema.push((prices[i] - ema[ema.length - 1]) * multiplier + ema[ema.length - 1]);
            }
            return ema;
        }

        function calculateRSI(prices, period = 14) {
            if (prices.length < period + 1) return [];
            let gains = [], losses = [];
            for (let i = 1; i < prices.length; i++) {
                const change = prices[i] - prices[i - 1];
                gains.push(Math.max(0, change));
                losses.push(Math.max(0, -change));
            }
            let rsi = [];
            for (let i = period - 1; i < gains.length; i++) {
                const avgGain = gains.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
                const avgLoss = losses.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
                rsi.push(avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss)));
            }
            return rsi;
        }

        function calculateMACD(prices) {
            const ema12 = calculateEMA(prices, 12);
            const ema26 = calculateEMA(prices, 26);
            if (!ema12.length || !ema26.length) return {macd: [], signal: []};
            const minLen = Math.min(ema12.length, ema26.length);
            const macd = [];
            for (let i = 0; i < minLen; i++) {
                macd.push(ema12[ema12.length - minLen + i] - ema26[ema26.length - minLen + i]);
            }
            const signal = calculateEMA(macd, 9);
            return {macd, signal};
        }

        // API 调用
        async function fetchBinanceKlines() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=200');
                const data = await response.json();
                return data.map(k => ({
                    open: parseFloat(k[1]),
                    high: parseFloat(k[2]),
                    low: parseFloat(k[3]),
                    close: parseFloat(k[4]),
                    volume: parseFloat(k[5])
                }));
            } catch (e) {
                log('获取币安数据失败: ' + e.message, 'error');
                return null;
            }
        }

        async function fetchFearGreed() {
            try {
                const response = await fetch('https://api.alternative.me/fng/');
                const data = await response.json();
                return parseInt(data.data[0].value);
            } catch (e) {
                return null;
            }
        }

        // 信号检测
        function detectSignals(klines, fearGreed) {
            const signals = [];
            const prices = klines.map(k => k.close);
            const currentPrice = prices[prices.length - 1];

            const ema7 = calculateEMA(prices, 7);
            const ema25 = calculateEMA(prices, 25);
            const ema50 = calculateEMA(prices, 50);
            const ema200 = calculateEMA(prices, 200);
            const rsi = calculateRSI(prices);
            const macdData = calculateMACD(prices);

            // 更新UI
            if (rsi.length) document.getElementById('rsiValue').textContent = rsi[rsi.length - 1].toFixed(1);
            if (ema7.length && ema25.length) {
                document.getElementById('emaStatus').textContent = ema7[ema7.length - 1] > ema25[ema25.length - 1] ? '📈 多头' : '📉 空头';
            }

            // EMA 7/25 交叉
            if (ema7.length >= 2 && ema25.length >= 2) {
                if (ema7[ema7.length - 2] <= ema25[ema25.length - 2] && ema7[ema7.length - 1] > ema25[ema25.length - 1]) {
                    signals.push({key: "EMA_7_25_Golden", price: currentPrice});
                } else if (ema7[ema7.length - 2] >= ema25[ema25.length - 2] && ema7[ema7.length - 1] < ema25[ema25.length - 1]) {
                    signals.push({key: "EMA_7_25_Death", price: currentPrice});
                }
            }

            // EMA 50/200 交叉
            if (ema50.length >= 2 && ema200.length >= 2) {
                if (ema50[ema50.length - 2] <= ema200[ema200.length - 2] && ema50[ema50.length - 1] > ema200[ema200.length - 1]) {
                    signals.push({key: "EMA_50_200_Golden", price: currentPrice});
                } else if (ema50[ema50.length - 2] >= ema200[ema200.length - 2] && ema50[ema50.length - 1] < ema200[ema200.length - 1]) {
                    signals.push({key: "EMA_50_200_Death", price: currentPrice});
                }
            }

            // RSI
            if (rsi.length) {
                const currentRSI = rsi[rsi.length - 1];
                if (currentRSI < 20) signals.push({key: "RSI_Oversold", price: currentPrice, extra: `RSI=${currentRSI.toFixed(1)}`});
                else if (currentRSI > 80) signals.push({key: "RSI_Overbought", price: currentPrice, extra: `RSI=${currentRSI.toFixed(1)}`});
            }

            // MACD
            if (macdData.macd.length >= 2 && macdData.signal.length >= 2) {
                const m = macdData.macd, s = macdData.signal;
                if (m[m.length - 2] <= s[s.length - 2] && m[m.length - 1] > s[s.length - 1]) {
                    signals.push({key: "MACD_Golden", price: currentPrice});
                } else if (m[m.length - 2] >= s[s.length - 2] && m[m.length - 1] < s[s.length - 1]) {
                    signals.push({key: "MACD_Death", price: currentPrice});
                }
            }

            // 恐惧贪婪
            if (fearGreed !== null) {
                if (fearGreed <= 10) signals.push({key: "Fear_Extreme", price: currentPrice, extra: `F&G=${fearGreed}`});
                else if (fearGreed >= 90) signals.push({key: "Greed_Extreme", price: currentPrice, extra: `F&G=${fearGreed}`});
            }

            // 7日闪崩
            if (prices.length >= 168) {
                const change7d = (currentPrice - prices[prices.length - 168]) / prices[prices.length - 168] * 100;
                if (change7d <= -15) signals.push({key: "Flash_Crash", price: currentPrice, extra: `7日跌幅=${change7d.toFixed(1)}%`});
            }

            // Pin Bar
            const lastCandle = klines[klines.length - 1];
            const body = Math.abs(lastCandle.close - lastCandle.open);
            const upperWick = lastCandle.high - Math.max(lastCandle.close, lastCandle.open);
            const lowerWick = Math.min(lastCandle.close, lastCandle.open) - lastCandle.low;
            if (lowerWick > body * 2 && lowerWick > upperWick * 2) signals.push({key: "Bullish_Pin_Bar", price: currentPrice});
            else if (upperWick > body * 2 && upperWick > lowerWick * 2) signals.push({key: "Bearish_Pin_Bar", price: currentPrice});

            // 过滤冷却中的信号
            const now = Date.now();
            return signals.filter(s => {
                if (!lastSignals[s.key] || (now - lastSignals[s.key]) > SIGNAL_COOLDOWN) {
                    lastSignals[s.key] = now;
                    return true;
                }
                return false;
            });
        }

        // 发送通知
        async function sendTelegram(signal) {
            const token = document.getElementById('tgToken').value;
            const chatId = document.getElementById('tgChatId').value;
            const config = STRATEGIES[signal.key];
            const isLong = config.type === "LONG";
            const direction = isLong ? "🟢 做多 LONG" : "🔴 做空 SHORT";
            const tp = isLong ? signal.price * (1 + config.tp / 100) : signal.price * (1 - config.tp / 100);
            const sl = isLong ? signal.price * (1 - config.sl / 100) : signal.price * (1 + config.sl / 100);

            const message = `🚨 <b>BTC/USDT 交易信号</b>
━━━━━━━━━━━━━━━━━━━━

<b>${direction}</b>

📊 <b>策略:</b> ${signal.key.replace(/_/g, ' ')}
📈 <b>胜率:</b> ${config.win_rate}%
💪 <b>信号强度:</b> ${config.win_rate >= 75 ? '⭐⭐⭐⭐⭐ 极强' : config.win_rate >= 70 ? '⭐⭐⭐⭐ 强' : '⭐⭐⭐ 中等'}

━━━━━━━━━━━━━━━━━━━━

💰 <b>入场价格:</b> $${signal.price.toLocaleString()}
✅ <b>止盈:</b> $${tp.toLocaleString()} (+${config.tp}%)
❌ <b>止损:</b> $${sl.toLocaleString()} (-${config.sl}%)
⚡ <b>杠杆倍数:</b> ${config.leverage}倍

━━━━━━━━━━━━━━━━━━━━

📝 <b>策略说明:</b> ${config.desc}${signal.extra ? ' (' + signal.extra + ')' : ''}

⚠️ <i>风险提示: 仅供参考，请自行判断</i>`;

            try {
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: chatId, text: message, parse_mode: 'HTML'})
                });
                return true;
            } catch (e) {
                return false;
            }
        }

        async function sendDiscord(signal) {
            const webhook = document.getElementById('discordWebhook').value;
            const config = STRATEGIES[signal.key];
            const isLong = config.type === "LONG";
            const tp = isLong ? signal.price * (1 + config.tp / 100) : signal.price * (1 - config.tp / 100);
            const sl = isLong ? signal.price * (1 - config.sl / 100) : signal.price * (1 + config.sl / 100);

            const embed = {
                title: '🚨 BTC/USDT 交易信号',
                color: isLong ? 65280 : 16711680,
                fields: [
                    {name: '📊 方向', value: isLong ? '🟢 **做多 LONG**' : '🔴 **做空 SHORT**', inline: true},
                    {name: '📈 策略', value: signal.key.replace(/_/g, ' '), inline: true},
                    {name: '🎯 胜率', value: `**${config.win_rate}%**`, inline: true},
                    {name: '💰 入场价格', value: `$${signal.price.toLocaleString()}`, inline: true},
                    {name: '✅ 止盈', value: `$${tp.toLocaleString()} (+${config.tp}%)`, inline: true},
                    {name: '❌ 止损', value: `$${sl.toLocaleString()} (-${config.sl}%)`, inline: true},
                    {name: '⚡ 杠杆倍数', value: `**${config.leverage}倍**`, inline: true},
                    {name: '💪 信号强度', value: config.win_rate >= 75 ? '⭐⭐⭐⭐⭐ 极强' : config.win_rate >= 70 ? '⭐⭐⭐⭐ 强' : '⭐⭐⭐ 中等', inline: true},
                    {name: '📝 策略说明', value: config.desc + (signal.extra ? ' (' + signal.extra + ')' : ''), inline: false}
                ],
                footer: {text: '⚠️ 风险提示: 仅供参考 | ' + new Date().toLocaleString()}
            };

            try {
                await fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({embeds: [embed]})
                });
                return true;
            } catch (e) {
                return false;
            }
        }

        // 主监控循环
        async function monitorLoop() {
            checkCount++;
            document.getElementById('checkCount').textContent = checkCount;
            document.getElementById('statusDot').className = 'status-dot dot-yellow';

            const klines = await fetchBinanceKlines();
            const fearGreed = await fetchFearGreed();

            if (!klines) {
                document.getElementById('statusDot').className = 'status-dot dot-green';
                return;
            }

            const currentPrice = klines[klines.length - 1].close;
            document.getElementById('currentPrice').textContent = currentPrice.toLocaleString();
            document.getElementById('fearGreed').textContent = fearGreed || '--';
            document.getElementById('lastCheck').textContent = new Date().toLocaleTimeString();

            const signals = detectSignals(klines, fearGreed);

            if (signals.length > 0) {
                for (const signal of signals) {
                    signalCount++;
                    document.getElementById('signalCount').textContent = signalCount;
                    log(`🚨 发现信号: ${signal.key} @ $${signal.price.toLocaleString()}`, 'signal');

                    const tgOk = await sendTelegram(signal);
                    const discordOk = await sendDiscord(signal);

                    if (tgOk || discordOk) {
                        log(`✅ 信号已推送 (TG:${tgOk ? '✓' : '✗'} Discord:${discordOk ? '✓' : '✗'})`, 'info');
                    } else {
                        log('❌ 信号推送失败', 'error');
                    }
                }
            } else {
                log(`检查完成 | BTC=$${currentPrice.toLocaleString()} | F&G=${fearGreed || 'N/A'} | 无新信号`, 'info');
            }

            document.getElementById('statusDot').className = 'status-dot dot-green';
        }

        // 控制函数
        function startMonitor() {
            if (isRunning) return;
            isRunning = true;
            updateStatus(true);
            log('🚀 监控已启动，每60秒检查一次', 'info');
            monitorLoop();
            intervalId = setInterval(monitorLoop, 60000);
        }

        function stopMonitor() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(intervalId);
            updateStatus(false);
            log('⏹️ 监控已停止', 'warning');
        }

        async function sendTestSignal() {
            log('发送测试信号...', 'info');
            const testSignal = {key: "EMA_7_25_Golden", price: 95000, extra: "测试信号"};
            const tgOk = await sendTelegram(testSignal);
            const discordOk = await sendDiscord(testSignal);
            log(`测试信号发送完成 (TG:${tgOk ? '✓' : '✗'} Discord:${discordOk ? '✓' : '✗'})`, tgOk || discordOk ? 'signal' : 'error');
        }

        // 初始化
        updateStatus(false);
        log('系统就绪，点击"启动监控"开始', 'info');
